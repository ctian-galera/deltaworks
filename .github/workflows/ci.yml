name: DeltaWorks CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Tests

    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: deltaworks_test
          POSTGRES_USER: deltaworks
          POSTGRES_PASSWORD: deltaworks_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deltaworks -d deltaworks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://deltaworks:deltaworks_ci@localhost:5432/deltaworks_test
          TEST_DATABASE_URL: postgresql+psycopg://deltaworks:deltaworks_ci@localhost:5432/deltaworks_test
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://deltaworks:deltaworks_ci@localhost:5432/deltaworks_test
          TEST_DATABASE_URL: postgresql+psycopg://deltaworks:deltaworks_ci@localhost:5432/deltaworks_test
        run: pytest